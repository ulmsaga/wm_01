<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f3c"/>
      <stop offset="100%" style="stop-color:#050d1f"/>
    </linearGradient>
    <filter id="glow-strong">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="none"
        stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- 연결선 (패킷 경로) -->
  <g stroke="#00d4ff" stroke-opacity="0.45" stroke-width="0.9" filter="url(#glow-soft)">
    <line x1="16" y1="16" x2="16" y2="5.5"/>   <!-- 상 -->
    <line x1="16" y1="16" x2="26" y2="11"/>     <!-- 우상 -->
    <line x1="16" y1="16" x2="26" y2="22"/>     <!-- 우하 -->
    <line x1="16" y1="16" x2="16" y2="26.5"/>   <!-- 하 -->
    <line x1="16" y1="16" x2="6"  y2="22"/>     <!-- 좌하 -->
    <line x1="16" y1="16" x2="6"  y2="11"/>     <!-- 좌상 -->
  </g>

  <!-- 외곽 노드 (장비/엔드포인트) -->
  <g fill="#00d4ff" filter="url(#glow-soft)">
    <circle cx="16"   cy="5.5"  r="1.6"/>  <!-- 상 -->
    <circle cx="26"   cy="11"   r="1.6"/>  <!-- 우상 -->
    <circle cx="26"   cy="22"   r="1.6"/>  <!-- 우하 -->
    <circle cx="16"   cy="26.5" r="1.6"/>  <!-- 하 -->
    <circle cx="6"    cy="22"   r="1.6"/>  <!-- 좌하 -->
    <circle cx="6"    cy="11"   r="1.6"/>  <!-- 좌상 -->
  </g>

  <!-- 중앙 노드 글로우 (인텔리전스 허브) -->
  <circle cx="16" cy="16" r="5" fill="#00d4ff" fill-opacity="0.15" filter="url(#glow-strong)"/>

  <!-- 중앙 노드 본체 -->
  <circle cx="16" cy="16" r="3.2" fill="#00d4ff" filter="url(#glow-strong)"/>
  <circle cx="16" cy="16" r="1.5" fill="#e0f8ff"/>
</svg>
